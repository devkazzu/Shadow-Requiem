name: Android APK

on:
  push:
    branches:
      - main
      - arena/01a09116-shadow-requiem
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64_PRESENT: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD_PRESENT: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS_PRESENT: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD_PRESENT: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build web vertical slice
        run: npm run build

      - name: Setup Java for Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Capacitor Android project
        run: node scripts/prepare-android.mjs

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Build unsigned release APK
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64_PRESENT != '' && env.ANDROID_KEYSTORE_PASSWORD_PRESENT != '' && env.ANDROID_KEY_ALIAS_PRESENT != '' && env.ANDROID_KEY_PASSWORD_PRESENT != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/release.keystore

      - name: Sign release APK when signing secrets exist
        if: ${{ env.ANDROID_KEYSTORE_BASE64_PRESENT != '' && env.ANDROID_KEYSTORE_PASSWORD_PRESENT != '' && env.ANDROID_KEY_ALIAS_PRESENT != '' && env.ANDROID_KEY_PASSWORD_PRESENT != '' }}
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-requiem-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-requiem-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            ${{ steps.sign_app.outputs.signedReleaseFile }}
          if-no-files-found: warn

      - name: Create GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            ${{ steps.sign_app.outputs.signedReleaseFile }}
